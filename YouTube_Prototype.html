<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Prototype</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; max-width:900px; margin:24px auto; padding:12px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .upload-btn { padding:10px 14px; border-radius:8px; background:#0b63ff; color:white; border: none; cursor:pointer; }
    #progress { width:100%; height:8px; background:#eee; border-radius:6px; overflow:hidden; margin-top:8px; display:none; }
    #bar { height:100%; width:0%; background:#0b63ff; transition:width .2s; }
    .video-list { margin-top:18px; display:flex; flex-direction:column; gap:18px; }
    .video-item { border-radius:8px; padding:12px; box-shadow:0 1px 6px rgba(0,0,0,0.08); }
    video { width:100%; max-height:480px; background:black; border-radius:6px; }
    .meta { margin-top:6px; display:flex; justify-content:space-between; font-size:14px; color:#444; }
    .footer-note { margin-top:18px; color:#666; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>YouTube Prototype</h1>
    <div>
      <button class="upload-btn" id="uploadButton">Upload .mp4</button>
      <input type="file" id="fileInput" accept="video/mp4" style="display:none" />
    </div>
  </header>

  <div id="progress"><div id="bar"></div></div>
  <div id="status" aria-live="polite" style="margin-top:8px"></div>

  <section class="video-list" id="videoList"></section>

  <div class="footer-note">
    Newest videos appear at top. Files must be .mp4. This is a public upload demo — consider moderation/rate limiting.
  </div>

  <script type="module">
    // --- IMPORT FIREBASE (modular v9+) via CDN ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-storage.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // --- REPLACE with your Firebase config from the console ---
    const firebaseConfig = {
      apiKey: "REPLACE_API_KEY",
      authDomain: "REPLACE_AUTH_DOMAIN",
      projectId: "REPLACE_PROJECT_ID",
      storageBucket: "REPLACE_STORAGE_BUCKET",
      messagingSenderId: "REPLACE_MESSAGING_SENDER_ID",
      appId: "REPLACE_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const db = getFirestore(app);

    // UI elements
    const uploadButton = document.getElementById('uploadButton');
    const fileInput = document.getElementById('fileInput');
    const progress = document.getElementById('progress');
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');
    const videoList = document.getElementById('videoList');

    // Open file chooser on button click
    uploadButton.addEventListener('click', () => fileInput.click());

    // Handle file selection
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.type !== 'video/mp4') {
        alert('Only .mp4 files are allowed.');
        return;
      }

      try {
        status.textContent = 'Preparing upload...';
        progress.style.display = 'block';
        bar.style.width = '0%';

        // create a storage ref under /videos/<timestamp>_<filename>
        const timestamp = Date.now();
        const safeName = `${timestamp}_${file.name.replace(/\s+/g,'_')}`;
        const ref = storageRef(storage, `videos/${safeName}`);

        const uploadTask = uploadBytesResumable(ref, file, { contentType: file.type });
        uploadTask.on('state_changed',
          (snap) => {
            const percent = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
            bar.style.width = percent + '%';
            status.textContent = `Uploading: ${percent}%`;
          },
          (err) => {
            console.error(err);
            status.textContent = 'Upload failed: ' + err.message;
            progress.style.display = 'none';
          },
          async () => {
            // Upload complete
            const url = await getDownloadURL(uploadTask.snapshot.ref);
            status.textContent = 'Upload complete — saving metadata...';
            // Save metadata to Firestore
            await addDoc(collection(db, 'videos'), {
              name: file.name,
              url,
              size: file.size,
              contentType: file.type,
              createdAt: serverTimestamp()
            });
            status.textContent = 'Saved. Video will appear on the page.';
            fileInput.value = ''; // reset input
            setTimeout(()=>{ progress.style.display='none'; status.textContent=''; }, 1500);
          }
        );

      } catch (err) {
        console.error(err);
        status.textContent = 'Error: ' + err.message;
        progress.style.display = 'none';
      }
    });

    // Realtime listener: show docs ordered newest-first
    const q = query(collection(db, 'videos'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snapshot) => {
      // Clear
      videoList.innerHTML = '';
      // Render each video doc (newest first)
      snapshot.forEach(doc => {
        const data = doc.data();
        const wrapper = document.createElement('div');
        wrapper.className = 'video-item';

        // Video element (use controls)
        const v = document.createElement('video');
        v.controls = true;
        v.src = data.url;
        v.setAttribute('preload', 'metadata');
        // Show name + date
        const meta = document.createElement('div');
        meta.className = 'meta';
        const name = document.createElement('div');
        name.textContent = data.name || 'untitled';
        const date = document.createElement('div');
        const created = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : null;
        date.textContent = created ? created.toLocaleString() : '';

        meta.appendChild(name);
        meta.appendChild(date);

        wrapper.appendChild(v);
        wrapper.appendChild(meta);

        videoList.appendChild(wrapper);
      });
    }, (err) => {
      console.error('Realtime error:', err);
      status.textContent = 'Error loading videos: ' + err.message;
    });

  </script>
</body>
</html>
